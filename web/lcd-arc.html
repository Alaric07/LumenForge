{{ define "lcd-arc" }}
{{ $arc := index .LCDProfiles 100 }}
{{ $lcdSensors := .LCDSensors }}
<section class="lf-lcd-panel" aria-labelledby="lf-lcd-arc-title">
    <header class="lf-lcd-panel-header">
        <h2 id="lf-lcd-arc-title">{{ if $arc.Name }}{{ $arc.Name }}{{ else }}Arc{{ end }}</h2>
    </header>
    <div class="lf-lcd-panel-body">
        <div class="lf-lcd-settings">
            <div class="lf-lcd-row">
                <label class="lf-lcd-label" for="sensorType_{{ $arc.Id }}">{{ .Lang "txtSensor" }}</label>
                <select id="sensorType_{{ $arc.Id }}" class="lf-lcd-select sensorType" name="userProfile">
                    {{ range $k, $v := $lcdSensors }}
                    <option value="{{ $k }}"{{ if eq $k $arc.Sensor }} selected{{ end }}>{{ $v }}</option>
                    {{ end }}
                </select>
            </div>
            <div class="lf-lcd-row">
                <label class="lf-lcd-label" for="margin_{{ $arc.Id }}">{{ .Lang "txtMargin" }}</label>
                <input class="lf-lcd-input" type="text" id="margin_{{ $arc.Id }}" value="{{ $arc.Margin }}">
            </div>
            <div class="lf-lcd-row">
                <label class="lf-lcd-label" for="thickness_{{ $arc.Id }}">{{ .Lang "txtThickness" }}</label>
                <input class="lf-lcd-input" type="text" id="thickness_{{ $arc.Id }}" value="{{ $arc.Thickness }}">
            </div>
            <div class="lf-lcd-row">
                <label class="lf-lcd-label" for="gapRadians_{{ $arc.Id }}">{{ .Lang "txtBottomGap" }}</label>
                <input class="lf-lcd-input" type="text" id="gapRadians_{{ $arc.Id }}" value="{{ $arc.GapRadians }}">
            </div>
            <div class="lf-lcd-row">
                <label class="lf-lcd-label" for="backgroundColor_{{ $arc.Id }}">{{ .Lang "txtBackground" }}</label>
                <input class="lf-lcd-color" type="color" id="backgroundColor_{{ $arc.Id }}" value="{{ $arc.Background.Hex }}">
            </div>
            <div class="lf-lcd-row">
                <label class="lf-lcd-label" for="borderColor_{{ $arc.Id }}">{{ .Lang "txtBorderColor" }}</label>
                <input class="lf-lcd-color" type="color" id="borderColor_{{ $arc.Id }}" value="{{ $arc.BorderColor.Hex }}">
            </div>
            <div class="lf-lcd-row">
                <label class="lf-lcd-label" for="startColor_{{ $arc.Id }}">{{ .Lang "txtStartColor" }}</label>
                <input class="lf-lcd-color" type="color" id="startColor_{{ $arc.Id }}" value="{{ $arc.StartColor.Hex }}">
            </div>
            <div class="lf-lcd-row">
                <label class="lf-lcd-label" for="endColor_{{ $arc.Id }}">{{ .Lang "txtEndColor" }}</label>
                <input class="lf-lcd-color" type="color" id="endColor_{{ $arc.Id }}" value="{{ $arc.EndColor.Hex }}">
            </div>
            <div class="lf-lcd-row">
                <label class="lf-lcd-label" for="textColor_{{ $arc.Id }}">{{ .Lang "txtTextColor" }}</label>
                <input class="lf-lcd-color" type="color" id="textColor_{{ $arc.Id }}" value="{{ $arc.TextColor.Hex }}">
            </div>
        </div>
        <div class="lf-lcd-actions lf-settings-panel-footer">
            <button class="lf-button lf-lcd-button saveArcProfile" type="button" data-info="{{ $arc.Id }}">{{ .Lang "txtSaveProfile" }}</button>
        </div>
    </div>
</section>
{{ end }}
