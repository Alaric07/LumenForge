{{ define "lcd-upload" }}
<section class="lf-lcd-panel lf-lcd-panel-upload" aria-labelledby="lf-lcd-upload-title">
    <header class="lf-lcd-panel-header">
        <h2 id="lf-lcd-upload-title">{{ .Lang "txtUploadImage" }}</h2>
    </header>
    <form class="lf-lcd-panel-body" id="gifUploadForm" enctype="multipart/form-data">
        <label class="lf-lcd-file-label" for="animationFile">{{ .Lang "txtUploadImage" }}</label>
        <input type="file"
               class="lf-lcd-file-input"
               id="animationFile"
               name="animationFile"
               accept=".gif,.jpg,.jpeg,.webp,.bmp,image/gif,image/jpeg,image/webp,image/bmp">
        <div class="lf-lcd-actions">
            <button class="lf-button lf-lcd-button uploadGifImage" id="uploadGifImage" type="submit">{{ .Lang "txtUpload" }}</button>
        </div>
    </form>
</section>
{{ end }}
